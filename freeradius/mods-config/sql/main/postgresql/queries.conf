# =============================================================================
# FreeRADIUS 3.x - PostgreSQL Queries for Hostel Wi-Fi Billing
# Location: /etc/freeradius/3.0/mods-config/sql/main/postgresql/queries.conf
# =============================================================================

safe_characters = "@abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_: /"

# -----------------------------------------------------------------------------
# AUTHORIZATION QUERIES
# -----------------------------------------------------------------------------

# Fetch check items (password or Auth-Type := Accept/Reject)
authorize_check_query = "\
    SELECT id, username, attribute, value, op \
    FROM ${authcheck_table} \
    WHERE username = '%{SQL-User-Name}' \
    ORDER BY id"

# Fetch reply items (Mikrotik-Rate-Limit, Session-Timeout, Acct-Interim-Interval)
authorize_reply_query = "\
    SELECT id, username, attribute, value, op \
    FROM ${authreply_table} \
    WHERE username = '%{SQL-User-Name}' \
    ORDER BY id"

# -----------------------------------------------------------------------------
# ACCOUNTING QUERIES
# Live bandwidth and session time updates from Access Points / MikroTik
# -----------------------------------------------------------------------------

# Accounting Start (Student connects to Wi-Fi)
accounting_start_query = "\
    INSERT INTO ${acct_table1} ( \
        acctsessionid, acctuniqueid, username, nasipaddress, \
        nasportid, nasporttype, acctstarttime, acctsessiontime, \
        acctauthentic, connectinfo_start, acctinputoctets, \
        acctoutputoctets, calledstationid, callingstationid, \
        servicetype, framedprotocol, framedipaddress \
    ) VALUES ( \
        '%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', \
        '%{NAS-IP-Address}', '%{NAS-Port-Id}', '%{NAS-Port-Type}', \
        NOW(), 0, '%{Acct-Authentic}', '%{Connect-Info}', 0, 0, \
        '%{Called-Station-Id}', '%{Calling-Station-Id}', \
        '%{Service-Type}', '%{Framed-Protocol}', NULLIF('%{Framed-IP-Address}', '')::inet \
    )"

# Accounting Interim-Update (Every 5 minutes, updates consumed bytes)
accounting_update_query = "\
    UPDATE ${acct_table1} SET \
        framedipaddress = NULLIF('%{Framed-IP-Address}', '')::inet, \
        acctsessiontime = %{%{Acct-Session-Time}:-0}, \
        acctinputoctets = %{%{Acct-Input-Gigawords}:-0} * 4294967296 + %{%{Acct-Input-Octets}:-0}, \
        acctoutputoctets = %{%{Acct-Output-Gigawords}:-0} * 4294967296 + %{%{Acct-Output-Octets}:-0}, \
        acctupdatetime = NOW() \
    WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

# Accounting Stop (Student disconnects or session times out)
accounting_stop_query = "\
    UPDATE ${acct_table1} SET \
        acctstoptime = NOW(), \
        acctsessiontime = %{%{Acct-Session-Time}:-0}, \
        acctinputoctets = %{%{Acct-Input-Gigawords}:-0} * 4294967296 + %{%{Acct-Input-Octets}:-0}, \
        acctoutputoctets = %{%{Acct-Output-Gigawords}:-0} * 4294967296 + %{%{Acct-Output-Octets}:-0}, \
        acctterminatecause = '%{Acct-Terminate-Cause}', \
        connectinfo_stop = '%{Connect-Info}' \
    WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"
